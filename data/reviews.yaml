- name: "Martin Krug (Dimanzia)"
  stars: 5
  text: "Vrelo odporúčam! Crow Production sme oslovili na spoluprácu pri tvorbe krátkych propagačných videí. Celý tím nám bol od samotného začiatku veľmi nápomocný, poskytli odborné rady, k natáčaniu pristupovali veľmi svedomito, vyzdvihnúť môžeme aj krásne útulné priestory, kde sa celá práca uskutočnila!"
- name: "Lex"
  stars: 5
  text: "Spolupráca s touto úžasnou tímom bola fantastická! Naša skúsenosť s natáčaním klipu bola výnimočná. Prístup bol nielen profesionálny, ale aj mimoriadne príjemný – sú to skutočne skvelí ľudia. Od pomoci so scenárom až po postprodukciu a finálny strih bolo všetko zvládnuté perfektne. Ak hľadáte tím, ktorý odvedie úžasnú prácu, určite ich odporúčam!"
- name: "Klaudia Godžaková"
  stars: 5
  text: "Šikovní chalani, veľmi profesionálny prístup. Klip dopadol ešte lepšie, ako boli moje predstavy. V porovnaní kvalita vs. cena sa to ani nedá zrovnať s konkurenciou. Odporúčam a určite plánujem aj ďalšiu spoluprácu :)"
- name: "Spark"
  stars: 5
  text: "Profesionálny prístup, super dohovor... partia mladých ľudí, čo vie! Prišli do Česka, natočili klip a poslali bombu."
- name: "Nathan Kay"
  stars: 5
  text: "Využili sme služby Crow Production na natáčanie videí, strihanie hudobných videí, postprodukciu, počítačovú grafiku, nahrávanie a mastering hudby aj fotografické služby."
- name: "Dušan Kukuricudus"
  stars: 5
  text: "Top práca, top prístup."
- name: "Dávid Čorma"
  stars: 5
  text: "Perfektné miesto!"
- name: "Patrik Slezák"
  stars: 5
  text: "Kreativita, ochota, kvalita. Chalani vedia, čo robia, a robia to perfektne. Maximálna spokojnosť."
- name: "Sofia Okolicanyova"
  stars: 5
  text: "Super prístup a neskutočne super výsledky. Chalani sú fakt profi, 100 % spokojnosť."
- name: "Petra Morena Swan"
  stars: 5
  text: "S chalanmi som absolvovala zaujímavé fotenie, kde sme kombinovali interiér a exteriér. S fotkami som veľmi spokojná."
- name: "Kristína Selecká"
  stars: 5
  text: "Profesionálny prístup od chalanov, dávam si u nich robiť veľa fotiek a videí a vždy som maximálne spokojná. Rýchla komunikácia, priateľský prístup a veľmi kvalitná práca."
- name: "Tommy Katona"
  stars: 5
  text: "Skvelá práca, profesionálny prístup, kreatívny tím ľudí, ktorý odovzdáva kvalitnú službu. 100 % spokojnosť z mojej strany."
- name: "Morenas Dancegroup"
  stars: 5
  text: "Veľmi príjemná a profi spolupráca. Od chalanov máme viacero vecí – fotky, promo video aj web. So všetkým sme veľmi spokojní a tešíme sa na ďalšiu spoluprácu."
- name: "Martin Halaga"
  stars: 5
  text: "Chalani majú super prístup a profi robotu."
- name: "Samuel Činčala"
  stars: 5
  text: "S Matúšom som bol fakt veľmi spokojný. Je to neskutočne zlatý človek, veľmi šikovný a hlavne profesionál, ktorý presne vie, čo robí. Od prvého momentu som sa cítil úplne prirodzene a výsledné fotky dopadli ešte lepšie, než som čakal. Je vidieť, že ho tá práca baví a dáva si záležať na každom detaile. Za mňa jednoznačne odporúčam – určite to nebola naša posledná spolupráca."
