- number: "04"
  title: "Nahrávanie v štúdiu"
  description: "Nahrávanie hudby, podcastov a hlasu vo vlastnom nahrávacom štúdiu — profesionálny zvuk a technické zázemie."
- number: "05"
  title: "Tvorba web stránky"
  description: "Návrh a tvorba web stránky pre firmy aj umelcov — od štruktúry a dizajnu po nasadenie a správu obsahu."
- number: "06"
  title: "Grafický dizajn"
  description: "Grafický dizajn pre firmy aj interpretov — vizuálna identita, obaly, plagáty a podklady na sociálne siete."
