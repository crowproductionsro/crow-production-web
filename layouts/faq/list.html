{{ define "main" }}
<section class="page-hero">
  <div class="container">
    <p class="eyebrow">{{ .Params.eyebrow }}</p>
    <h1>{{ .Title }}</h1>
    <p class="section-sub">{{ .Params.lead }}</p>
  </div>
</section>

<section class="faq-section">
  <div class="container">
    <div class="faq-list">
      {{ range .Pages.ByWeight }}
      {{ $category := "" }}
      {{ with .Params.category }}{{ $category = index hugo.Data.faq_categories . }}{{ end }}
      <a href="{{ .RelPermalink }}" class="faq-item">
        <div class="faq-item-text">
          {{ with $category }}<span class="faq-category">{{ .name }}</span>{{ end }}
          <h3>{{ .Title }}</h3>
        </div>
        <span class="faq-arrow">&rarr;</span>
      </a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
