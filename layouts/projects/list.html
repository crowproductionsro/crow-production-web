{{ define "main" }}
<section class="page-hero">
  <div class="container">
    <p class="eyebrow">{{ .Params.eyebrow }}</p>
    <h1>{{ .Title }}</h1>
    <p class="section-sub">{{ .Params.lead }}</p>
  </div>
</section>

<section class="portfolio">
  <div class="container">
    <div class="portfolio-grid">
      {{ range $i, $p := .Pages.ByWeight }}
      <a href="{{ $p.RelPermalink }}" class="portfolio-item{{ if $p.Params.large }} item-large{{ end }}">
        <div class="portfolio-thumb thumb-{{ add (mod $i 5) 1 }}"></div>
        <div class="portfolio-info">
          <span class="portfolio-tag">{{ $p.Params.tag }}</span>
          <h3>{{ $p.Title }}</h3>
          <p>{{ $p.Params.description }}</p>
        </div>
      </a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
