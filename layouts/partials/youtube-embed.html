{{- $id := partial "youtube-id.html" . -}}
{{- if $id -}}
<div class="youtube-embed">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ $id }}" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>
</div>
{{- end -}}
