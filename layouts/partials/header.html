<header class="site-header" id="siteHeader">
  <div class="container header-inner">
    <a href="/" class="logo">
      <img src="/img/uploads/crow-production-logo-videoprodukcia.webp" alt="Crow Production">
    </a>

    <nav class="main-nav" id="mainNav">
      {{ range .Site.Menus.main }}
      {{ if .Children }}
      <div class="nav-dropdown">
        <a href="{{ .URL }}">{{ .Name }}</a>
        <div class="nav-dropdown-menu">
          {{ range .Children }}
          <a href="{{ .URL }}">{{ .Name }}</a>
          {{ end }}
        </div>
      </div>
      {{ else }}
      <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
      {{ end }}
    </nav>

    <button class="search-toggle" id="searchToggle" aria-label="Hľadať">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>

    <a href="/#contact" class="btn btn-outline header-cta">Nezáväzná ponuka</a>

    <button class="burger" id="burgerBtn" aria-label="Otvoriť menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
