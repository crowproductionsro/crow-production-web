<header class="site-header" id="siteHeader">
  <div class="container header-inner">
    <a href="/#home" class="logo">
      <img src="/img/uploads/crow-production-logo-videoprodukcia.png" alt="Crow Production">
    </a>

    <nav class="main-nav" id="mainNav">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>

    <a href="/#contact" class="btn btn-outline header-cta">Nezáväzná ponuka</a>

    <button class="burger" id="burgerBtn" aria-label="Otvoriť menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
