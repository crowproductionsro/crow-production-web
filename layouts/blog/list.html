{{ define "main" }}
<section class="page-hero">
  <div class="container">
    <p class="eyebrow">{{ .Params.eyebrow }}</p>
    <h1>{{ .Title }}</h1>
    <p class="section-sub">{{ .Params.lead }}</p>
  </div>
</section>

<section class="blog-section">
  <div class="container">
    <div class="blog-grid">
      {{ range .Pages.ByDate.Reverse }}
      <a href="{{ .RelPermalink }}" class="blog-card">
        <span class="blog-card-date">{{ partial "format-date.html" .Date }}</span>
        <h3>{{ .Title }}</h3>
        <p>{{ .Params.summary }}</p>
      </a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
