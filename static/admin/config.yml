backend:
  name: git-gateway
  branch: main

media_folder: "static/img/uploads"
public_folder: "/img/uploads"

locale: "sk"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "projects"
    label: "🎬 Projekty"
    label_singular: "Projekt"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Názov projektu", name: "title", widget: "string" }
      - { label: "URL adresa (slug)", name: "slug", widget: "string", required: false, hint: "Časť webovej adresy za /projects/. Ak necháte prázdne, vygeneruje sa automaticky z názvu. Zmenou tu zmeníte aj skutočnú URL stránky." }
      - label: "Kategória"
        name: "category"
        widget: "relation"
        collection: "project_categories"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
        hint: "Kategórie projektov spravujete v sekcii „🎬 Projekty — Kategórie“."
      - { label: "Krátky popis (na kartičke)", name: "description", widget: "string" }
      - { label: "Fotografia", name: "image", widget: "image", required: false }
      - { label: "YouTube video", name: "youtube_video", widget: "string", required: false, hint: "Vložte celú adresu YouTube videa (napr. https://www.youtube.com/watch?v=... alebo https://youtu.be/...). Ak je vyplnené, na stránke projektu sa zobrazí namiesto fotografie." }
      - { label: "Zvýrazniť ako veľkú dlaždicu na hlavnej stránke", name: "large", widget: "boolean", default: false }
      - { label: "Poradie zobrazenia (nižšie číslo = vyššie)", name: "weight", widget: "number", value_type: "int", default: 10 }
      - { label: "SEO titulok", name: "seo_title", widget: "string", required: false, hint: "Zobrazí sa v záložke prehliadača a vo výsledkoch vyhľadávania. Ak necháte prázdne, použije sa názov projektu." }
      - { label: "Meta popis", name: "meta_description", widget: "text", required: false, hint: "Krátky popis pre vyhľadávače, cca 150-160 znakov." }
      - { label: "Skryté (koncept)", name: "draft", widget: "boolean", default: false, hint: "Zapnite, ak sa má projekt dočasne skryť z webu." }
      - { label: "Detailný popis projektu", name: "body", widget: "markdown", required: false }

  - name: "project_categories"
    label: "🎬 Projekty — Kategórie"
    label_singular: "Kategória projektu"
    folder: "data/project_categories"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    format: "yaml"
    extension: "yaml"
    fields:
      - { label: "Názov kategórie", name: "name", widget: "string" }

  - name: "blog"
    label: "📝 Blog — Články"
    label_singular: "Článok"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titulok článku", name: "title", widget: "string" }
      - { label: "URL adresa (slug)", name: "slug", widget: "string", required: false, hint: "Časť webovej adresy za /blog/. Ak necháte prázdne, vygeneruje sa automaticky z titulku. Zmenou tu zmeníte aj skutočnú URL článku." }
      - { label: "Dátum publikovania", name: "date", widget: "datetime" }
      - label: "Kategória"
        name: "category"
        widget: "relation"
        collection: "blog_categories"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
        hint: "Kategórie blogu spravujete v sekcii „📝 Blog — Kategórie“."
      - label: "Podkategória"
        name: "subcategory"
        widget: "relation"
        collection: "blog_subcategories"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
        hint: "Podkategórie blogu spravujete v sekcii „📝 Blog — Podkategórie“. Vyberte tú, ktorá patrí k zvolenej kategórii."
      - label: "Autor"
        name: "author"
        widget: "relation"
        collection: "authors"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
        hint: "Autorov spravujete v sekcii „📝 Blog — Autori“."
      - { label: "Krátky popis (na výpise blogu)", name: "summary", widget: "text" }
      - { label: "Titulná fotografia", name: "cover_image", widget: "image", required: false }
      - { label: "ALT text titulnej fotografie", name: "cover_image_alt", widget: "string", required: false, hint: "Krátky popis fotky pre nevidiacich a SEO, napr. „Natáčanie reklamného spotu v štúdiu“." }
      - { label: "YouTube video", name: "youtube_video", widget: "string", required: false, hint: "Vložte celú adresu YouTube videa (napr. https://www.youtube.com/watch?v=... alebo https://youtu.be/...). Zobrazí sa pod titulnou fotografiou článku." }
      - { label: "SEO titulok", name: "seo_title", widget: "string", required: false, hint: "Zobrazí sa v záložke prehliadača a vo výsledkoch vyhľadávania. Ak necháte prázdne, použije sa titulok článku." }
      - { label: "Meta popis", name: "meta_description", widget: "text", required: false, hint: "Krátky popis pre vyhľadávače, cca 150-160 znakov." }
      - { label: "Skryté (koncept)", name: "draft", widget: "boolean", default: false, hint: "Zapnite, ak sa má článok dočasne skryť z webu." }
      - label: "Obsah článku"
        name: "body"
        widget: "markdown"
        hint: "Fotku vložíte cez ikonu obrázka v paneli nástrojov. Po vložení upravte text v hranatých zátvorkách ![...] — slúži ako ALT text fotky pre SEO a nevidiacich."
        buttons:
          - "heading-one"
          - "heading-two"
          - "heading-three"
          - "bold"
          - "italic"
          - "code"
          - "link"
          - "bulleted-list"
          - "numbered-list"
          - "quote"
        editor_components: ["image"]
      - label: "Fotogaléria"
        name: "gallery"
        widget: "list"
        required: false
        hint: "Pridajte viacero fotiek — zobrazia sa ako galéria na konci článku, podobne ako vo WordPresse."
        fields:
          - { label: "Fotografia", name: "image", widget: "image" }
          - { label: "ALT text", name: "alt", widget: "string", required: false }

  - name: "blog_categories"
    label: "📝 Blog — Kategórie"
    label_singular: "Kategória blogu"
    folder: "data/blog_categories"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    format: "yaml"
    extension: "yaml"
    fields:
      - { label: "Názov kategórie", name: "name", widget: "string" }

  - name: "blog_subcategories"
    label: "📝 Blog — Podkategórie"
    label_singular: "Podkategória blogu"
    folder: "data/blog_subcategories"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    format: "yaml"
    extension: "yaml"
    fields:
      - { label: "Názov podkategórie", name: "name", widget: "string" }
      - label: "Nadradená kategória"
        name: "category"
        widget: "relation"
        collection: "blog_categories"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]

  - name: "authors"
    label: "📝 Blog — Autori"
    label_singular: "Autor"
    folder: "data/authors"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    format: "yaml"
    extension: "yaml"
    fields:
      - { label: "Meno autora", name: "name", widget: "string" }
      - { label: "Fotografia autora", name: "photo", widget: "image", required: false }
      - { label: "Popis autora (bio)", name: "bio", widget: "text", required: false }

  - name: "faq"
    label: "❓ FAQ — Otázky"
    label_singular: "Otázka"
    folder: "content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Otázka", name: "title", widget: "string" }
      - { label: "URL adresa (slug)", name: "slug", widget: "string", required: false, hint: "Časť webovej adresy za /faq/. Ak necháte prázdne, vygeneruje sa automaticky z otázky. Zmenou tu zmeníte aj skutočnú URL otázky." }
      - label: "Kategória"
        name: "category"
        widget: "relation"
        collection: "faq_categories"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
        hint: "Kategórie FAQ spravujete v sekcii „❓ FAQ — Kategórie“."
      - label: "Podkategória"
        name: "subcategory"
        widget: "relation"
        collection: "faq_subcategories"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
        hint: "Podkategórie FAQ spravujete v sekcii „❓ FAQ — Podkategórie“. Vyberte tú, ktorá patrí k zvolenej kategórii."
      - { label: "Poradie zobrazenia (nižšie číslo = vyššie)", name: "weight", widget: "number", value_type: "int", default: 10 }
      - { label: "SEO titulok", name: "seo_title", widget: "string", required: false, hint: "Zobrazí sa v záložke prehliadača a vo výsledkoch vyhľadávania. Ak necháte prázdne, použije sa otázka." }
      - { label: "Meta popis", name: "meta_description", widget: "text", required: false, hint: "Krátky popis pre vyhľadávače, cca 150-160 znakov." }
      - { label: "Skryté (koncept)", name: "draft", widget: "boolean", default: false, hint: "Zapnite, ak sa má otázka dočasne skryť z webu." }
      - { label: "Odpoveď", name: "body", widget: "markdown" }

  - name: "faq_categories"
    label: "❓ FAQ — Kategórie"
    label_singular: "Kategória FAQ"
    folder: "data/faq_categories"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    format: "yaml"
    extension: "yaml"
    fields:
      - { label: "Názov kategórie", name: "name", widget: "string" }

  - name: "faq_subcategories"
    label: "❓ FAQ — Podkategórie"
    label_singular: "Podkategória FAQ"
    folder: "data/faq_subcategories"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    format: "yaml"
    extension: "yaml"
    fields:
      - { label: "Názov podkategórie", name: "name", widget: "string" }
      - label: "Nadradená kategória"
        name: "category"
        widget: "relation"
        collection: "faq_categories"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
