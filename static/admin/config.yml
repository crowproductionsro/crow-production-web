backend:
  name: git-gateway
  branch: main

media_folder: "static/img/uploads"
public_folder: "/img/uploads"

locale: "sk"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "projects"
    label: "Projekty"
    label_singular: "Projekt"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Názov projektu", name: "title", widget: "string" }
      - label: "Kategória"
        name: "tag"
        widget: "select"
        options:
          - "Reklamný spot"
          - "Videoklip"
          - "Svadobné video"
          - "Produktové video"
          - "Firemné video"
          - "Fotografia"
      - { label: "Krátky popis (na kartičke)", name: "description", widget: "string" }
      - { label: "Fotografia", name: "image", widget: "image", required: false }
      - { label: "Zvýrazniť ako veľkú dlaždicu na hlavnej stránke", name: "large", widget: "boolean", default: false }
      - { label: "Poradie zobrazenia (nižšie číslo = vyššie)", name: "weight", widget: "number", value_type: "int", default: 10 }
      - { label: "SEO titulok", name: "seo_title", widget: "string", required: false, hint: "Zobrazí sa v záložke prehliadača a vo výsledkoch vyhľadávania. Ak necháte prázdne, použije sa názov projektu." }
      - { label: "Meta popis", name: "meta_description", widget: "text", required: false, hint: "Krátky popis pre vyhľadávače, cca 150-160 znakov." }
      - { label: "Skryté (koncept)", name: "draft", widget: "boolean", default: false, hint: "Zapnite, ak sa má projekt dočasne skryť z webu." }
      - { label: "Detailný popis projektu", name: "body", widget: "markdown", required: false }

  - name: "blog"
    label: "Blog"
    label_singular: "Článok"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titulok článku", name: "title", widget: "string" }
      - { label: "Dátum publikovania", name: "date", widget: "datetime" }
      - label: "Kategória"
        name: "category"
        widget: "relation"
        collection: "categories"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
        hint: "Kategórie spravujete v sekcii Kategórie nižšie."
      - label: "Podkategória"
        name: "subcategory"
        widget: "relation"
        collection: "subcategories"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
        hint: "Podkategórie spravujete v sekcii Podkategórie nižšie. Vyberte tú, ktorá patrí k zvolenej kategórii."
      - label: "Autor"
        name: "author"
        widget: "relation"
        collection: "authors"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
        hint: "Autorov spravujete v sekcii Autori nižšie."
      - { label: "Krátky popis (na výpise blogu)", name: "summary", widget: "text" }
      - { label: "Titulná fotografia", name: "cover_image", widget: "image", required: false }
      - { label: "ALT text titulnej fotografie", name: "cover_image_alt", widget: "string", required: false, hint: "Krátky popis fotky pre nevidiacich a SEO, napr. „Natáčanie reklamného spotu v štúdiu“." }
      - { label: "SEO titulok", name: "seo_title", widget: "string", required: false, hint: "Zobrazí sa v záložke prehliadača a vo výsledkoch vyhľadávania. Ak necháte prázdne, použije sa titulok článku." }
      - { label: "Meta popis", name: "meta_description", widget: "text", required: false, hint: "Krátky popis pre vyhľadávače, cca 150-160 znakov." }
      - { label: "Skryté (koncept)", name: "draft", widget: "boolean", default: false, hint: "Zapnite, ak sa má článok dočasne skryť z webu." }
      - label: "Obsah článku"
        name: "body"
        widget: "markdown"
        hint: "Fotku vložíte cez ikonu obrázka v paneli nástrojov. Po vložení upravte text v hranatých zátvorkách ![...] — slúži ako ALT text fotky pre SEO a nevidiacich."
        buttons:
          - "heading-one"
          - "heading-two"
          - "heading-three"
          - "bold"
          - "italic"
          - "code"
          - "link"
          - "bulleted-list"
          - "numbered-list"
          - "quote"
        editor_components: ["image"]
      - label: "Fotogaléria"
        name: "gallery"
        widget: "list"
        required: false
        hint: "Pridajte viacero fotiek — zobrazia sa ako galéria na konci článku, podobne ako vo WordPresse."
        fields:
          - { label: "Fotografia", name: "image", widget: "image" }
          - { label: "ALT text", name: "alt", widget: "string", required: false }

  - name: "categories"
    label: "Kategórie (Blog aj FAQ)"
    label_singular: "Kategória"
    folder: "data/categories"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    format: "yaml"
    fields:
      - { label: "Názov kategórie", name: "name", widget: "string" }

  - name: "subcategories"
    label: "Podkategórie (Blog aj FAQ)"
    label_singular: "Podkategória"
    folder: "data/subcategories"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    format: "yaml"
    fields:
      - { label: "Názov podkategórie", name: "name", widget: "string" }
      - label: "Nadradená kategória"
        name: "category"
        widget: "relation"
        collection: "categories"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]

  - name: "authors"
    label: "Autori"
    label_singular: "Autor"
    folder: "data/authors"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    format: "yaml"
    fields:
      - { label: "Meno autora", name: "name", widget: "string" }
      - { label: "Fotografia autora", name: "photo", widget: "image", required: false }
      - { label: "Popis autora (bio)", name: "bio", widget: "text", required: false }

  - name: "faq"
    label: "FAQ"
    label_singular: "Otázka"
    folder: "content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Otázka", name: "title", widget: "string" }
      - label: "Kategória"
        name: "category"
        widget: "relation"
        collection: "categories"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
        hint: "Kategórie spravujete v sekcii Kategórie."
      - label: "Podkategória"
        name: "subcategory"
        widget: "relation"
        collection: "subcategories"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
        hint: "Podkategórie spravujete v sekcii Podkategórie. Vyberte tú, ktorá patrí k zvolenej kategórii."
      - { label: "Poradie zobrazenia (nižšie číslo = vyššie)", name: "weight", widget: "number", value_type: "int", default: 10 }
      - { label: "SEO titulok", name: "seo_title", widget: "string", required: false, hint: "Zobrazí sa v záložke prehliadača a vo výsledkoch vyhľadávania. Ak necháte prázdne, použije sa otázka." }
      - { label: "Meta popis", name: "meta_description", widget: "text", required: false, hint: "Krátky popis pre vyhľadávače, cca 150-160 znakov." }
      - { label: "Skryté (koncept)", name: "draft", widget: "boolean", default: false, hint: "Zapnite, ak sa má otázka dočasne skryť z webu." }
      - { label: "Odpoveď", name: "body", widget: "markdown" }
